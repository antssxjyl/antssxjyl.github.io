<!DOCTYPE html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>

<style>
:root {
    --bg:#FCFBF8;
    --text:#2C2C2C;
    --sub:#888;
    --border:#EAE6DF;
}

* {
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body {
    background:var(--bg);
    color:var(--text);
    font-family:system-ui,sans-serif;
    line-height:1.6;
    min-height:100vh;
    display:flex;
}

/* 左侧栏 */
.sidebar {
    width:220px;
    padding:40px 30px;
    border-right:1px solid var(--border);
    flex-shrink:0;
}

.sidebar h1 {
    font-size:18px;
    margin-bottom:35px;
}

nav a {
    display:block;
    color:var(--sub);
    text-decoration:none;
    font-size:15px;
    margin-bottom:15px;
}

nav a:hover,
nav .active {
    color:var(--text);
}


/* 内容 */
.content {
    width:100%;
    max-width:760px;
    padding:50px 40px;
}

.content h2 {
    font-size:20px;
    margin-bottom:30px;
}

.post-list {
    list-style:none;
}

.post-list li {
    margin-bottom:25px;
}

.post-list a {
    color:var(--text);
    text-decoration:none;
    font-size:17px;
}

.post-list a:hover {
    text-decoration:underline;
}

.post-date {
    color:var(--sub);
    font-size:13px;
}


/* 手机 */
@media(max-width:600px){

    body {
        display:block;
    }

    .sidebar {
        width:100%;
        height:auto;
        padding:25px 20px;
        border-right:none;
        border-bottom:1px solid var(--border);
    }

    .sidebar h1 {
        margin-bottom:15px;
    }

    nav {
        display:flex;
        gap:20px;
    }

    nav a {
        margin:0;
    }

    .content {
        padding:30px 20px;
    }

}
</style>

</head>


<body>

<aside class="sidebar">

<h1>./</h1>

<nav>
<a href="index.html" class="active">Home</a>
<a href="about.html">About</a>
</nav>

</aside>


<main class="content">

<h2>./posts</h2>

<ul class="post-list">

<li>
<a href="posts/1.html">First one</a>
<div class="post-date">2026-07-12</div>
</li>

</ul>

</main>


</body>
</html>
