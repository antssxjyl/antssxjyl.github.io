<style>

:root{
    --bg:#FCFBF8;
    --text:#2C2C2C;
    --sub:#888;
    --border:#EAE6DF;
}


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{

    background:var(--bg);
    color:var(--text);
    font-family:system-ui,sans-serif;
    line-height:1.7;

    min-height:100vh;
    display:flex;

}



/* sidebar */

.sidebar{

    width:220px;
    padding:40px 30px;

    border-right:1px solid var(--border);

    flex-shrink:0;

}


.sidebar h1{

    font-size:18px;
    margin-bottom:35px;

}


nav a{

    display:block;

    color:var(--sub);
    text-decoration:none;

    font-size:15px;

    margin-bottom:15px;

}


nav a:hover{

    color:var(--text);

}



/* content */


.content{

    width:100%;
    max-width:760px;

    padding:50px 40px;

}



.back{

    display:inline-block;

    color:var(--sub);

    text-decoration:none;

    font-size:14px;

    margin-bottom:30px;

    font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Consolas,
    monospace;

}


.back:hover{

    color:var(--text);

}



/* markdown */


.article h1{

    font-size:28px;

    margin:20px 0;

}


.article h2{

    font-size:21px;

    margin:35px 0 15px;

    border-bottom:1px solid var(--border);

    padding-bottom:5px;

}


.article h3{

    font-size:18px;

    margin:25px 0 10px;

}


.article p{

    margin-bottom:18px;

}


.article ul,
.article ol{

    margin-bottom:18px;

    padding-left:25px;

}



.article a{

    color:var(--text);

}



.article code{

    font-family:

    ui-monospace,
    SFMono-Regular,
    Menlo,
    Consolas,
    monospace;


    background:rgba(0,0,0,.06);

    padding:2px 6px;

    border-radius:4px;

    font-size:.85em;

}



.article pre{

    background:#F5F2EB;

    border:1px solid var(--border);

    padding:18px;

    border-radius:6px;

    overflow-x:auto;

    margin-bottom:20px;

}



.article pre code{

    background:none;

    padding:0;

    font-size:13px;

}



.article blockquote{

    border-left:3px solid var(--border);

    padding-left:15px;

    color:var(--sub);

    margin:20px 0;

}



.article img{

    max-width:100%;

    height:auto;

}



.katex-display{

    overflow-x:auto;

    overflow-y:hidden;

    padding:10px 0;

}


.katex{

    font-size:1.1em;

}



/* mobile */


@media(max-width:600px){


    body{

        display:block;

    }



    .sidebar{

        width:100%;

        padding:25px 20px;

        border-right:none;

        border-bottom:1px solid var(--border);

    }



    .sidebar h1{

        margin-bottom:15px;

    }



    nav{

        display:flex;

        gap:20px;

    }



    nav a{

        margin:0;

    }



    .content{

        padding:30px 20px;

    }



    .article h1{

        font-size:23px;

    }


    .article pre{

        padding:14px;

    }


}


</style>
